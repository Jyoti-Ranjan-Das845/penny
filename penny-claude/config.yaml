spec_version: 1
name: penny
description: 'Writing assistant with independent review and ordered model backups:
  assess, challenge, and review messages, documents, and generic writing lessons.
  Plain language, accurate meaning, and your voice come first.'
executor:
  type: omnigent
  model: claude-opus-5
  reasoning_effort: medium
  fallbacks:
  - model: claude-fable-5-1
    reasoning_effort: medium
    harness: claude-native
  config:
    harness: claude-native
    permission_mode: bypassPermissions
    yolo: false
instructions: AGENTS.md
skills: none
async: true
cancellable: true
tools:
  agents:
  - intent
  - curator
  - reader
  - applier
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
