spec_version: 1
name: intent
description: Understands the artifact purpose, context, and how source material should
  be used.
executor:
  type: omnigent
  model: claude-opus-5
  reasoning_effort: medium
  fallbacks:
  - model: claude-fable-5-1
    reasoning_effort: medium
    harness: claude-native
  config:
    harness: claude-native
    permission_mode: bypassPermissions
    yolo: false
instructions: AGENTS.md
skills: none
guardrails:
