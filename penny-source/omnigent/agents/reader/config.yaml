spec_version: 1
name: reader
description: Independently proposes, challenges, and checks the final text for meaning and natural voice.
executor:
  type: omnigent
  model: claude-fable-5-1
  reasoning_effort: max
  fallbacks:
    - model: claude-opus-5
      harness: claude-native
      reasoning_effort: max
    - model: gpt-6-astra
      harness: codex-native
      reasoning_effort: xhigh
  config:
    harness: claude-native
    permission_mode: manual
    yolo: false
instructions: AGENTS.md
skills: none
guardrails:
  policies:
    supplied_material_only:
      type: function
      function:
        path: omnigent.policies.function.make_fixed_action_callable
        arguments:
          action: deny
          on_phases: [tool_call]
          reason: This role reviews only the supplied material; tool calls are disabled.
