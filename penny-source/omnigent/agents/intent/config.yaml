guardrails:
  policies:
    supplied_material_only:
      type: function
      function:
        path: omnigent.policies.function.make_fixed_action_callable
        arguments:
          action: deny
          on_phases: [tool_call]
          reason: This role reviews only the supplied material; tool calls are disabled.
