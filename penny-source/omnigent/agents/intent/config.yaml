spec_version: 1
name: intent
description: Understands the artifact purpose, context, and how source material should be used.
executor:
  type: omnigent
  model: gpt-6-astra
  reasoning_effort: xhigh
  fallbacks:
    - model: claude-fable-5-1
      harness: claude-native
      reasoning_effort: max
    - model: claude-opus-5
      harness: claude-native
      reasoning_effort: max
  config:
    harness: codex-native
    yolo: false
instructions: AGENTS.md
